<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CakBro - Safe Exam Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SPLASH SCREEN (mirror AHK Splash) -->
  <div id="splash" class="splash">
    <div class="splash-line top"></div>
    <img src="assets/pakkar-logo.png" alt="Pakkar" class="splash-logo" />
    <h1 class="splash-title">CakBro</h1>
    <p class="splash-subtitle">Safe Exam Browser</p>
    <div class="splash-divider"></div>
    <p class="splash-desc">Mempersiapkan lingkungan ujian yang aman...</p>
    <p class="splash-version" id="splashVersion">v2.0 — Powered by Electron Kiosk</p>
    <div class="splash-line bottom"></div>
    <div class="splash-loader"><div class="loader-bar"></div></div>
  </div>

  <!-- BOTTOM BAR (mirror AHK CreateBottomBar) 42px -->
  <div id="bottomBar" class="bottom-bar">
    <div class="bar-accent"></div>
    <div class="bar-content">
      <div class="bar-left">
        <img src="assets/pakkar-logo.png" alt="Pakkar" class="brand-logo" title="Pakkar" />
        <span class="brand">CakBro</span>
        <div class="separator"></div>
        <button id="btnRefresh" class="btn-refresh" title="Muat ulang halaman ujian (Refresh)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
          Refresh
        </button>
        <div class="separator"></div>
        <span class="status-text">🔒 Supported by Pakkar</span>
      </div>

      <div class="bar-right">
        <div class="separator"></div>
        <span class="locked-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          LOCKED
        </span>
        <div class="separator"></div>
        <span id="clock" class="clock">00:00:00</span>
        <button id="btnExit" class="btn-exit" title="Keluar (Ctrl+Alt+Shift+Q)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
